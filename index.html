<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CRM Test Panel</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f0f0f;
  color:#fff;
}

.container {
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.card {
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

input, button {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}

input {
  background:#111;
  color:#fff;
}

button {
  background:#4f46e5;
  color:#fff;
  cursor:pointer;
}

button:hover {
  background:#3730a3;
}

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.preview {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.preview img {
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #333;
}

pre {
  background:#000;
  padding:10px;
  border-radius:8px;
  overflow:auto;
}
</style>
</head>

<body>

<div class="container">

<h2>🔥 CRM TEST PANEL</h2>

<!-- LOGIN -->
<div class="card">
<h3>Login JWT</h3>

<input id="email" value="shizu@email.com">
<input id="password" type="password" value="shizu1">

<button onclick="login()">Login</button>

<p id="loginStatus"></p>
</div>

<!-- PRODUCT -->
<div class="card">
<h3>Criar Produto</h3>

<div class="row">
<input id="name" placeholder="Nome" value="Camiseta Oversized Black">
<input id="sku" placeholder="SKU" value="CAM-001">
</div>

<div class="row">
<input id="price" placeholder="Preço" value="99.90">
<input id="stock" placeholder="Stock" value="10">
</div>

<input type="file" id="images" multiple onchange="previewImages()">

<div class="preview" id="preview"></div>

<button onclick="createProduct()">Criar Produto</button>

<pre id="result"></pre>
</div>

</div>

<script>

let token = null;

// ================= LOGIN =================
async function login() {

const res = await fetch("http://127.0.0.1:8000/api/auth/login/", {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify({
email: document.getElementById("email").value,
password: document.getElementById("password").value
})
});

const data = await res.json();

token = data.access;

document.getElementById("loginStatus").innerText =
"✔ logado com JWT";

console.log("TOKEN:", token);
}

// ================= PREVIEW =================
function previewImages() {

const input = document.getElementById("images");
const preview = document.getElementById("preview");

preview.innerHTML = "";

for (let file of input.files) {

const img = document.createElement("img");
img.src = URL.createObjectURL(file);

preview.appendChild(img);
}
}

// ================= CREATE PRODUCT =================
async function createProduct() {

const form = new FormData();

form.append("name", document.getElementById("name").value);
form.append("sku", document.getElementById("sku").value);
form.append("base_price", document.getElementById("price").value);
form.append("sale_price", document.getElementById("price").value);
form.append("stock", document.getElementById("stock").value);

const files = document.getElementById("images").files;

for (let i = 0; i < files.length; i++) {
form.append("images", files[i]); // 🔥 CORRETO
}

const res = await fetch("http://127.0.0.1:8000/api/products/products/", {
method:"POST",
headers:{
"Authorization":`Bearer ${token}`
},
body: form
});

const data = await res.json();

document.getElementById("result").innerText =
JSON.stringify(data,null,2);
}

</script>

</body>
</html>
